name: Integration Tests

on:
  pull_request:
    paths:
      - dkcutter.json
      - "scripts/**"
      - "!scripts/**/*.test.ts"
      - "template/**"
      - "tests/**"
      - versions.json

concurrency:
  group: integration-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-matrix:
    uses: ./.github/workflows/generate-matrix.yml

  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    needs: generate-matrix
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.generate-matrix.outputs.versions) }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Dockerfile
        run: bun run generate -y -f --postgresVersion ${{ matrix.postgres_version }}

      - name: Generate Extension Template
        if: ${{ matrix.extension_template != '' }}
        run: |
          bun run generate -y -f \
            --postgresVersion ${{ matrix.postgres_version }} \
            --outputImageSlug ${{ matrix.extension_template }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build local image for testing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.postgres_version }}
          load: true
          tags: postgres-test:${{ matrix.postgres_version }}
          cache-from: type=gha

      - name: Build local image with extension for testing
        if: ${{ matrix.extension_template != '' }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.extension_template }}
          load: true
          tags: postgres-test:${{ matrix.postgres_version }}-extensions
          build-args: |
            POSTGRES_VERSION=${{ matrix.postgres_version }}
            PG_APT_PACKAGES=postgresql-${{ matrix.postgres_major_version }}-postgis-3
            PG_DB_EXTENSIONS=postgis
          cache-from: type=gha

      - name: Run Integration Tests
        run: bash ./tests/test-docker.sh ${{ matrix.postgres_version }}

      - name: Run Extension Integration Tests
        if: ${{ matrix.extension_template != '' }}
        run: |
          bash ./tests/test-docker-extensions.sh \
            ${{ matrix.postgres_version }} ${{ matrix.postgres_major_version }}
